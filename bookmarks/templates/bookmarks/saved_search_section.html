{% load static %}
<section aria-labelledby="saved-searches-heading">
  <div class="section-header no-wrap">
    <h2 id="saved-searches-heading">Saved searches</h2>
    <ld-dropdown class="dropdown dropdown-right ml-auto">
      <button class="btn btn-noborder dropdown-toggle"
              aria-label="Saved searches menu">
        <svg width="20" height="20">
          <use href="{% static 'icons.svg' %}?v={{ app_version }}#menu"></use>
        </svg>
      </button>
      <ul class="menu" role="list" tabindex="-1">
        <li class="menu-item">
          <a href="{% url 'linkding:saved_searches.index' %}" class="menu-link">Manage saved searches</a>
        </li>
      </ul>
    </ld-dropdown>
  </div>
  <ul class="bundle-menu">
    {% for saved_search in saved_searches %}
      <li class="bundle-menu-item d-flex no-wrap">
        <a href="?{{ saved_search.query }}">{{ saved_search.name }}</a>
        <ld-dropdown class="dropdown dropdown-right ml-auto">
          <button class="btn btn-noborder btn-sm dropdown-toggle"
                  aria-label="Open saved search on a page">
            <svg width="16" height="16">
              <use href="{% static 'icons.svg' %}?v={{ app_version }}#menu"></use>
            </svg>
          </button>
          <ul class="menu" role="list" tabindex="-1">
            <li class="menu-item">
              <a class="menu-link"
                 href="{% url 'linkding:bookmarks.index' %}?{{ saved_search.query }}">Open in bookmarks</a>
            </li>
            <li class="menu-item">
              <a class="menu-link"
                 href="{% url 'linkding:bookmarks.archived' %}?{{ saved_search.query }}">Open in archived</a>
            </li>
          </ul>
        </ld-dropdown>
      </li>
    {% endfor %}
  </ul>
</section>
